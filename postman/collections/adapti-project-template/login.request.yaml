$kind: http-request
name: login
url: "{{baseUrl}}/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"email\": \"test@example.com\",\r

    \    \"password\": \"password\"\r

    \r

    }"
scripts:
  - type: afterResponse
    code: |-
      const { token } = JSON.parse(responseBody)
      if (pm.response.code === 200) {
          pm.collectionVariables.set('authToken', token)
      }
    language: text/javascript
order: 2000
